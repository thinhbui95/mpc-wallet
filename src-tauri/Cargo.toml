[package]
name = "mpc-wallet"
version = "0.1.0"
description = "MPC Wallet desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "mpc_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
eyre = "0.6.12"
fastcrypto = "0.1.9"
gf256 = "0.3.0"
rand = "0.9.0"
hex = "0.4.3"
ethers = "2.0.13"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.98"
bip39 = "2.2.0"
bitcoin = "0.32.6"
secp256k1 = "0.31.1"
tiny-keccak = "2.0.2"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
k256 = "0.13.4"
sha3 = "0.10.8"
ethers-core = "2.0.14"
